name: Build CampRelay

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler avec Maven
        run: mvn -B package

      - name: Uploader le jar compilé
        uses: actions/upload-artifact@v4
        with:
          name: CampRelay-jar
          path: target/CampRelay.jar
